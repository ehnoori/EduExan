name: eduexam
description: "Class Evaluation App"
publish_to: 'none'
version: 3.0.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_fonts: ^6.3.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  excel_plus: ^2.29.2
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  file_picker: ^13.3.3
  syncfusion_flutter_pdf: ^33.2.13
  universal_document_viewer: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
 
  uses-material-design: true

  assets:
    - assets/images/
    - assets/files/eduexam_sample_questions.xlsx